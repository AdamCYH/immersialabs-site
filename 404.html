<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Page not found</title>
<style>
/* immersialabs.com only. A calm studio page: light by default, dark with the
   phone; the one accent is the cyan-pink-violet glow both app icons share. */
:root { color-scheme: light dark;
  --bg: #f5f5f8; --card: #ffffff; --text: #18181d; --muted: #5b5b66;
  --line: #e2e2e9; --link: #2456c9; --shadow: 0 1px 2px rgba(20,20,40,.05),
  0 6px 20px rgba(20,20,40,.06);
  --glow: linear-gradient(90deg, #3fd8ff, #ff5fa8 55%, #a57dff); }
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f0f14; --card: #18181f; --text: #ececf2; --muted: #a2a2ae;
  --line: #2a2a34; --link: #8db1ff; --shadow: none; } }
html { background: var(--bg); font-size: 106.25%; }
/* Safari: follow the phone's text size setting (Dynamic Type). */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
body { margin: 0; min-height: 100vh; min-height: 100svh; color: var(--text);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif; font-size: 1rem; line-height: 1.5; }
main { box-sizing: border-box; max-width: 34rem; margin: 0 auto;
  min-height: 100vh; min-height: 100svh; padding: max(3rem, 13vh) 1rem 2rem;
  display: flex; flex-direction: column; }
a { color: var(--link); text-underline-offset: 0.18em; }
h1 { margin: 0; font-size: clamp(1.75rem, 8.6vw, 2.75rem); line-height: 1.1;
  font-weight: 750; letter-spacing: -0.025em; }
/* The glow line over the name. */
h1::before { content: ""; display: block; width: 3.25rem; height: 0.3rem;
  margin-bottom: 1.4rem; border-radius: 1rem; background: var(--glow); }
main > p:first-of-type { margin: 0.7rem 0 0; color: var(--muted);
  font-size: 1.2rem; }
h2 { margin: 3rem 0 0.8rem; color: var(--muted); font-size: 0.8rem;
  font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; }
ul.apps { list-style: none; margin: 0; padding: 0; display: grid;
  gap: 0.75rem; }
ul.apps li { position: relative; display: flex; align-items: center;
  gap: 1rem; padding: 0.9rem 1rem 0.9rem 0.9rem; background: var(--card);
  border: 1px solid var(--line); border-radius: 1.1rem;
  box-shadow: var(--shadow); color: var(--muted); }
/* Icons in px: bigger text never makes them huge. */
ul.apps img { flex: none; width: 56px; height: 56px;
  border-radius: 22.5%; outline: 1px solid rgba(0,0,0,.06);
  outline-offset: -1px; }
ul.apps a { color: var(--text); font-weight: 650; text-decoration: none; }
/* The whole card is the link's tap area. */
ul.apps a::after { content: ""; position: absolute; inset: 0;
  border-radius: inherit; }
ul.apps li:hover { border-color: var(--muted); }
ul.apps a:focus-visible { outline: none; }
ul.apps li:has(a:focus-visible) { outline: 2px solid var(--link);
  outline-offset: 2px; }
.help { margin: 2.25rem 0 0; color: var(--muted); }
footer { margin-top: auto; padding-top: 3rem; color: var(--muted);
  font-size: 0.85rem; }
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p><a href="/">Immersia Labs LLC</a></p>
</main>
</body>
</html>
